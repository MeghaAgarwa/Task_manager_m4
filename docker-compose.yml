services:
  db:
    image: postgres:18.1-alpine
    container_name: task_manager_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:  # Added to ensure the database is ready before starting the web service
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_manager_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: task_manager_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - .env
    volumes:
      - .:/workspace
    depends_on:
      db:   # Added to ensure the web service waits for the database to be ready
        condition: service_healthy
    
volumes:
  db_data: